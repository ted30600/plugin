name: NovaAntiCheat
version: 0.1.0
main: fr.novastream.novaanticheat.NovaAntiCheat
api-version: '1.21'
author: NovaStream
description: Anti-cheat heuristique pour Paper 1.21.10
commands:
  novaac:
    description: Commandes d'administration de NovaAntiCheat
    usage: /novaac reload
    permission: novaanticheat.admin
permissions:
  novaanticheat.admin:
    description: Autorise à administrer NovaAntiCheat
    default: op
  novaanticheat.alerts:
    description: Reçoit les alertes anti-cheat
    default: op

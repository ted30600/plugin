name: Build NovaAntiCheat

on:
  push:
    paths:
      - "NovaAntiCheat/**"
  pull_request:
    paths:
      - "NovaAntiCheat/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NovaAntiCheat
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: NovaAntiCheat/pom.xml
      - name: Build with Maven
        run: mvn --batch-mode clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: NovaAntiCheat
          path: NovaAntiCheat/target/NovaAntiCheat.jar

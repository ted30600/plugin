<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtual NAS</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div id="login" class="screen"><div class="panel"><h1>Virtual NAS</h1><p>Stockage prive accessible depuis telephone et PC.</p><div id="setupBox" hidden><h2>Premier demarrage</h2><p>Créez le compte administrateur.</p><input id="setupUser" placeholder="Identifiant"><input id="setupPass" type="password" placeholder="Mot de passe (8 caracteres minimum)"><button type="button" onclick="setup()">Créer l'administrateur</button></div><div id="loginBox"><h2>Connexion</h2><input id="user" placeholder="Identifiant"><input id="pass" type="password" placeholder="Mot de passe"><button type="button" onclick="login()">Se connecter</button></div><p id="msg"></p></div></div>
<div id="app" hidden><header><div><strong>Virtual NAS</strong><span id="who"></span></div><div><button id="accountsBtn" type="button" hidden onclick="openAccounts()">Comptes</button><button type="button" onclick="logout()">Déconnexion</button></div></header><main><aside><h3>Mes espaces</h3><button type="button" class="manager active" data-m="1" onclick="selectManager('1')">Gestionnaire 1</button><button type="button" class="manager" data-m="2" onclick="selectManager('2')">Gestionnaire 2</button><button type="button" class="manager" data-m="3" onclick="selectManager('3')">Gestionnaire 3</button></aside><section><div class="toolbar"><div><h2 id="title">Gestionnaire 1</h2><span id="count"></span></div><label class="upload">＋ Ajouter des fichiers<input id="fileInput" type="file" multiple onchange="uploadFiles()"></label></div><input id="search" class="search" placeholder="Rechercher un fichier..." oninput="render()"><div id="files" class="files"></div></section></main></div>
<div id="modal" class="modal" hidden><div class="modalBox"><button id="closeAccounts" class="close" type="button" aria-label="Fermer" onclick="closeAccounts()">×</button><h2>Comptes utilisateurs</h2><div class="newAccount"><input id="newUser" placeholder="Identifiant"><input id="newPass" type="password" placeholder="Mot de passe"><select id="newRole"><option value="user">Utilisateur</option><option value="admin">Administrateur</option></select><button type="button" onclick="createAccount()">Créer</button></div><div id="accounts"></div></div></div>
<script src="/app.js?v=4"></script></body></html>

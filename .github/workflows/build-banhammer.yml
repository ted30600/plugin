name: Build BanHammer 26.2

on:
  workflow_dispatch:
  push:
    paths:
      - "banhammer/**"
      - ".github/workflows/build-banhammer.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: banhammer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build
        run: mvn -B clean package
      - name: Upload BanHammer-26.2.jar
        uses: actions/upload-artifact@v4
        with:
          name: BanHammer-26.2
          path: banhammer/target/BanHammer-26.2.jar

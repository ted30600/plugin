name: Build NovaHardcore

on:
  push:
    paths:
      - 'NovaHardcore/**'
      - '.github/workflows/build-novahardcore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        working-directory: NovaHardcore
        run: gradle --no-daemon clean build
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: NovaHardcore-1.0.0
          path: NovaHardcore/build/libs/NovaHardcore-1.0.0.jar
          if-no-files-found: error
          retention-days: 30

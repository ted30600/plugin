name: Build RandomTeleport

on:
  push:
    paths:
      - 'randomteleport/**'
      - '.github/workflows/randomteleport-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: randomteleport
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RandomTeleport-1.0.0
          path: randomteleport/target/RandomTeleport-1.0.0.jar

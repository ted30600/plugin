name: Build NovaKamoof 26.2
on:
  push:
    paths:
      - 'KamoofNova/**'
      - '.github/workflows/build-novakamoof.yml'
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build NovaKamoof
        working-directory: KamoofNova
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: NovaKamoof-26.2
          path: KamoofNova/target/NovaKamoof-1.0.0.jar
          if-no-files-found: error

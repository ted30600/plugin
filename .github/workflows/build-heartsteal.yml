name: Build HeartSteal 26.2

on:
  push:
    branches: ["main"]
    paths:
      - "heartsteal/**"
      - ".github/workflows/build-heartsteal.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: heartsteal
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build HeartSteal
        run: mvn -B clean package
      - name: Upload HeartSteal JAR
        uses: actions/upload-artifact@v4
        with:
          name: HeartSteal-26.2
          path: heartsteal/target/HeartSteal-26.2.jar
          if-no-files-found: error
          retention-days: 30

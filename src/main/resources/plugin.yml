name: NovaBedrock
version: 1.0.0
main: fr.ted30600.novabedrock.NovaBedrockPlugin
api-version: '1.20'
author: ted30600
description: Bouton cliquable pour ajouter le serveur Bedrock avec Geyser/Floodgate
softdepend:
  - floodgate
  - Geyser-Spigot
commands:
  bedrock:
    description: Affiche le bouton pour ajouter le serveur Bedrock
    usage: /bedrock
    permission: novabedrock.use
permissions:
  novabedrock.use:
    description: Permet d'utiliser /bedrock
    default: true
  novabedrock.admin:
    description: Permet de recharger la configuration
    default: op

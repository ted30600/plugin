name: NovaLobby
version: 1.1.0
main: fr.ted30600.zombielogin.ZombieLoginPlugin
api-version: '1.21'
author: ted30600
description: NovaLobby - système de lobby et login pour Paper 1.21.10
commands:
  login:
    description: Log into your account
    usage: /login <password>
  register:
    description: Register your account
    usage: /register <password> <password>
  lobby:
    description: Teleport to the lobby
    usage: /lobby
  setlobby:
    description: Set the current location as the lobby
    usage: /setlobby
  resetpassword:
    description: Reset a player's password
    usage: /resetpassword <joueur>
permissions:
  novalobby.admin:
    description: Manage NovaLobby, set the lobby and reset passwords
    default: op

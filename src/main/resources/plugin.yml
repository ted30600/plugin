name: RealSolarEconomy
version: 1.0.0
main: fr.ted30600.realsolareconomy.RealSolarEconomy
api-version: '1.21'
author: ted30600
description: Economy, shop, bank, trade and rankings for Paper 1.21.5. Bedrock compatible through Geyser.
commands:
  shop:
    permission: realsolareconomy.shop
  bank:
    permission: realsolareconomy.bank
  trade:
    permission: realsolareconomy.trade
  rich:
    permission: realsolareconomy.bank
  economy:
    permission: realsolareconomy.admin
permissions:
  realsolareconomy.shop: {default: true}
  realsolareconomy.bank: {default: true}
  realsolareconomy.trade: {default: true}
  realsolareconomy.admin: {default: op}
  realsolareconomy.admin.balance: {default: op}
  realsolareconomy.admin.modify: {default: op}
  realsolareconomy.admin.reload: {default: op}

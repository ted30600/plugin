# Adresse PUBLIQUE accessible depuis Internet par les joueurs Bedrock.
# Exemple : play.monserveur.fr
bedrock-address: "127.0.0.1"

# Port UDP utilisé par Geyser pour Bedrock.
bedrock-port: 19132

# Nom qui sera ajouté dans la liste des serveurs Bedrock.
server-name: "Mon serveur"

# Envoie automatiquement le bouton aux joueurs à leur connexion.
auto-send-on-join: true

messages:
  prefix: "&b&lBedrock &8» &f"
  button: "&a[ &f➜ AJOUTER LE SERVEUR BEDROCK &a]"
  added: "&7Le serveur sera ajouté à ta liste Bedrock."
  no-permission: "&cTu n'as pas la permission."
  reloaded: "&aConfiguration rechargée."

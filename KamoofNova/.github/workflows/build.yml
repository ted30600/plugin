name: Build NovaKamoof
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - working-directory: KamoofNova
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: NovaKamoof
          path: KamoofNova/target/NovaKamoof-1.0.0.jar